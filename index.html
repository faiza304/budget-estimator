<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction Budget Estimator</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
background: #333;
background-size: cover;
color: #fff;
}
.container {
max-width: 800px;
margin: 40px auto;
background-color: rgba(0, 0, 0, 0.75);
padding: 25px;
border-radius: 10px;
box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
}
.section {
margin-bottom: 20px;
}
label {
font-weight: bold;
}
select, input {
width: 100%;
padding: 10px;
margin-top: 5px;
border-radius: 5px;
border: none;
}
button {
padding: 10px 20px;
background-color: #4CAF50;
color: white;
border: none;
cursor: pointer;
border-radius: 5px;
margin-right: 10px;
}
button:hover {
background-color: #45a049;
}
</style>
</head>
<body>

<div class="container">
<h1>Construction Budget Estimator</h1>

<div class="section">
<label for="customerName">Customer Name:</label>
<input type="text" id="customerName" placeholder="Enter your name">
</div>

<div class="section">
<label for="purchaseDate">Purchase Date:</label>
<input type="date" id="purchaseDate">
</div>

<div class="section">
<label for="material">Select Material:</label>
<select id="material" onchange="showCompanyOptions()">
<option value="">--Select--</option>
<option value="Cement">Cement</option>
<option value="Steel">Steel</option>
<option value="Bricks">Bricks</option>
<option value="Sand">Sand</option>
<option value="Concrete">Concrete</option>
<option value="Paint">Paint</option>
<option value="Tiles">Tiles</option>
</select>
</div>

<div class="section" id="company-section" style="display:none;">
<label for="company">Select Company:</label>
<select id="company"></select>
</div>

<div class="section" id="quantity-section" style="display:none;">
<label for="quantity">Enter Quantity:</label>
<input type="number" id="quantity" min="0" step="any">

<label for="unit">Select Unit:</label>
<select id="unit"></select>
</div>

<div class="section">
<button onclick="addMaterial()">Add Material</button>
<button onclick="resetForm()">Reset</button>
</div>

<div class="section">
<label for="budget">Expected Budget (₹):</label>
<input type="number" id="budget" min="0">
</div>

<div class="section">
<button onclick="calculateBudget()">Calculate Budget</button>
</div>
</div>

<script>
const prices = {
Cement: { "UltraTech": 325, "Ambuja": 315, "ACC": 305, "JK": 295, "Birla": 310 },
Steel: { "Tata": 43000, "JSW": 41500, "SAIL": 40500, "Vizag": 39500, "Essar": 40000 },
Bricks: { "Ash Bricks": 6.5, "Red Bricks": 5.5, "Fly Ash": 7.2, "Eco Bricks": 6.0, "Concrete Bricks": 6.8 },
Sand: { "River Sand": 1650, "M-Sand": 1550, "Pit Sand": 1750, "Sea Sand": 1450, "Desert Sand": 1350 },
Concrete: { "Ready Mix": 4800, "UltraMix": 5000, "BuildWell": 4700, "SolidMix": 4900, "QuickSet": 4750 },
Paint: { "Asian Paints": 250, "Berger": 220, "Dulux": 240, "Nerolac": 210, "Indigo": 200 },
Tiles: { "Kajaria": 35, "Somany": 30, "Johnson": 32, "Orient": 28, "Nitco": 34 }
};

const units = {
Cement: "packets",
Steel: "tons",
Bricks: "pieces",
Sand: "tons",
Concrete: "cubic meters",
Paint: "liters",
Tiles: "sq ft"
};

const suppliers = {
Supplier1: {
Prices: { Cement: 300, Steel: 40000, Bricks: 5, Sand: 1500 },
Contact: "Rajesh - 9988776655",
Review: "4.5 ⭐ (Good quality, fast delivery)"
},
Supplier2: {
Prices: { Cement: 320, Steel: 42000, Bricks: 6, Sand: 1600 },
Contact: "Kumar - 9876543210",
Review: "4.2 ⭐ (Affordable pricing, slight delays)"
},
Supplier3: {
Prices: { Cement: 350, Steel: 45000, Bricks: 7, Sand: 1700 },
Contact: "Suresh - 8765432109",
Review: "4.8 ⭐ (Premium quality, reliable service)"
}
};

let userInput = [];

function showCompanyOptions() {
const material = document.getElementById('material').value;
const companySelect = document.getElementById('company');
const unitSelect = document.getElementById('unit');
const companySection = document.getElementById('company-section');
const quantitySection = document.getElementById('quantity-section');

if (material) {
companySection.style.display = 'block';
quantitySection.style.display = 'block';
companySelect.innerHTML = '<option value="">--Select Company--</option>';
unitSelect.innerHTML = '';

Object.keys(prices[material]).forEach(company => {
const option = document.createElement('option');
option.value = company;
option.textContent = company;
companySelect.appendChild(option);
});

const unitOption = document.createElement('option');
unitOption.value = units[material];
unitOption.textContent = units[material];
unitSelect.appendChild(unitOption);
} else {
companySection.style.display = 'none';
quantitySection.style.display = 'none';
}
}

function addMaterial() {
const material = document.getElementById('material').value;
const company = document.getElementById('company').value;
const quantity = parseFloat(document.getElementById('quantity').value);
const unit = document.getElementById('unit').value;

if (!material || !company || isNaN(quantity) || quantity <= 0) {
alert("Please fill in all fields with valid values.");
return;
}

userInput.push({ material, company, quantity, unit });

alert(`${material} (${company}) - ${quantity} ${unit} added.`);

document.getElementById('material').value = '';
document.getElementById('company').innerHTML = '';
document.getElementById('quantity').value = '';
document.getElementById('unit').innerHTML = '';
document.getElementById('company-section').style.display = 'none';
document.getElementById('quantity-section').style.display = 'none';
}

function calculateBudget() {
const customerName = document.getElementById('customerName').value;
const purchaseDate = document.getElementById('purchaseDate').value;
const budget = parseFloat(document.getElementById('budget').value);

if (!customerName || !purchaseDate || isNaN(budget) || budget < 0) {
alert("Please fill in all required fields with valid values.");
return;
}

if (userInput.length === 0) {
alert("Please add at least one material before calculating.");
return;
}

let summary = `<h2 style="text-align:center;">Construction Budget Summary</h2>`;
summary += `<pre style="font-family:monospace;">`;
summary += `--- Customer Details ---\n`;
summary += `Name: ${customerName}\n`;
summary += `Purchase Date: ${new Date(purchaseDate).toLocaleDateString()}\n\n`;
summary += "--- Budget Breakdown ---\n";

let estimatedBudget = 0;
userInput.forEach(item => {
const price = prices[item.material][item.company];
const total = price * item.quantity;
estimatedBudget += total;
summary += `${item.material} (${item.company}): ₹${price} x ${item.quantity} ${item.unit} = ₹${total.toFixed(2)}\n`;
});

summary += `\nTotal Estimated Budget: ₹${estimatedBudget.toFixed(2)}\n`;

if (estimatedBudget <= budget) {
summary += "✅ You have a sufficient budget!\n";

// Suggest supplier only if budget is sufficient and materials were added
let bestSupplier = null;
let bestTotal = Infinity;
for (const supplier in suppliers) {
let total = 0;
let valid = true;
userInput.forEach(item => {
const sPrice = suppliers[supplier].Prices[item.material];
if (sPrice !== undefined) {
total += sPrice * item.quantity;
} else {
valid = false;
}
});
if (valid && total < bestTotal) {
bestTotal = total;
bestSupplier = supplier;
}
}

if (bestSupplier) {
const info = suppliers[bestSupplier];
summary += `\n--- Suggested Supplier ---\n`;
summary += `🏢 ${bestSupplier} - ${info.Contact}\n`;
summary += `📢 Review: ${info.Review}\n`;
}
} else {
summary += "⚠ Budget insufficient. Consider adjusting material/company or increase budget.\n";
}

summary += `</pre>`;

const win = window.open('', '_blank');
win.document.write(summary);
}

function resetForm() {
document.getElementById('customerName').value = '';
document.getElementById('purchaseDate').value = '';
document.getElementById('material').value = '';
document.getElementById('company').innerHTML = '';
document.getElementById('quantity').value = '';
document.getElementById('unit').innerHTML = '';
document.getElementById('budget').value = '';
document.getElementById('company-section').style.display = 'none';
document.getElementById('quantity-section').style.display = 'none';
userInput = [];
alert("Form reset successfully!");
}
</script>

</body>
</html>
